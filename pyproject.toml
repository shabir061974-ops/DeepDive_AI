[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdive-ai"
version = "0.1.0"
description = "Self-verifying research foundation with bounded Mesh and public HTTP adapters"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DeepDive AI" }]

[project.optional-dependencies]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
